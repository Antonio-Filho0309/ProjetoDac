<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contas a Pagar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/estilo.css" />
    <link rel="stylesheet" href="css/tabela.css" />
    <link rel="stylesheet" href="css/cadastro.css" />
  </head>

  <body>

    <!-- Cabeçalho -->
    <nav class="navbar navbar-expand-lg bg-dark">

      <div class="container-fluid">

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

          <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="lista">

            <li class="nav-item">
              <a class="nav-link" href="pessoas.html">
                Pessoas
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contas.html">
                Contas
              </a>
            </li>

          </ul>

          <a class="btn btn-outline-danger" href="index.html">
            Sair
          </a>

        </div>

      </div>

    </nav>
    <!-- Fim Cabeçalho -->

    <!-- Modal -->
    <div id="vis-modal" class="modal">

      <div class="box" style="margin-top: 150px">

        <img
          src="img/botao-x.png"
          alt="Fechar"
          id="btn-fechar"
          onclick="fecharModal('vis-modal')"
        />

        <form id="classForm">

          <fieldset>

            <legend>
              <b>Cadastro de Conta</b>
            </legend>

            <!-- VALOR -->
            <div class="label-float">

              <input
                type="number"
                step="0.01"
                name="valor"
                id="valor"
                class="inputUser"
                placeholder=" "
                required
              />

              <label for="valor" class="labelInput">
                Valor
              </label>

            </div>

            <br />

            <!-- DATA VENCIMENTO -->
            <div class="label-float">

              <input
                type="date"
                name="data_vencimento"
                id="data_vencimento"
                class="inputUser"
                required
              />

              <label
                for="data_vencimento"
                class="labelInput"
              >
                Data de Vencimento
              </label>

            </div>

            <br />

            <!-- DATA PAGAMENTO -->
            <div class="label-float">

              <input
                type="date"
                name="data_pagamento"
                id="data_pagamento"
                class="inputUser"
              />

              <label
                for="data_pagamento"
                class="labelInput"
              >
                Data de Pagamento
              </label>

            </div>

          </fieldset>

          <br />
          <br />
          <br />

          <button type="submit" id="submit">
            Cadastrar
          </button>

        </form>

      </div>

    </div>

    <!-- Corpo -->
    <main>

      <div class="header-pag">

        <h1 class="titulo-pag">
          Contas a Pagar
        </h1>

        <a
          href="#"
          class="btn-new"
          onclick="abrirModal('vis-modal')"
        >
          Criar Novo
        </a>

      </div>

      <hr />

      <div class="container">

        <!-- Tabela -->
        <table class="table text-white table-bg mt-4">

          <thead class="bg-primary">

            <tr>

              <th>#</th>
              <th>Valor</th>
              <th>Vencimento</th>
              <th>Pagamento</th>
              <th>...</th>

            </tr>

          </thead>

          <tbody id="classList"></tbody>

        </table>

      </div>

    </main>

    <script src="js/modal.js"></script>
    <script src="js/contas.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
